<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You're offline</title>
    <style>
        :root { color-scheme: light; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #f8fafc; color: #0f172a; padding: 24px; box-sizing: border-box;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .card {
            max-width: 360px; width: 100%; background: #fff; border: 1px solid #e2e8f0;
            border-radius: 20px; padding: 32px 24px; text-align: center;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }
        .icon {
            width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 16px;
            background: rgba(99, 102, 241, 0.12); color: #6366f1;
            display: flex; align-items: center; justify-content: center; font-size: 30px;
        }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { color: #64748b; font-size: 14px; line-height: 1.5; margin: 0 0 22px; }
        button {
            border: 0; border-radius: 12px; padding: 12px 22px; font-size: 15px; font-weight: 600;
            background: #6366f1; color: #fff; cursor: pointer; width: 100%;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&#x1F4F6;</div>
        <h1>You're offline</h1>
        <p>Check your internet connection. Your timetable, homework and fees will load again as soon as you're back online.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
