<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* Salary Slip Styles */
.slip-title{font-size:17px;font-weight:700;color:#1F3A73;margin:4px 0 16px;text-align:left;}
.slip-card{border:1px solid #D5DBE6;border-radius:6px;overflow:hidden;background:#fff;margin-bottom:12px;}
.slip-grid{width:100%;border-collapse:collapse;font-size:12px;}
.slip-grid td{border:1px solid #E2E7F0;padding:6px 10px;vertical-align:top;}
.slip-grid td.lbl{color:#8A94A6;font-size:11px;font-weight:600;background:#FAFBFC;text-transform:capitalize;}
.slip-grid td.val-main{color:#1F3A73;font-size:12.5px;font-weight:700;}
.slip-grid td.val{color:#1F2A37;font-size:12px;}
.slip-grid td.val-sub{color:#4B5563;font-size:11.5px;line-height:1.3;}
.slip-grid tr.slip-basic-row{border-top:2px solid #8C7B65;border-bottom:2px solid #8C7B65;}
.slip-grid td.lbl-basic{background:#fff;color:#5A6580;font-weight:700;font-size:12.5px;padding:9px 10px;}
.slip-grid td.val-basic{background:#fff;color:#8A94A6;font-size:12px;text-align:left;padding:9px 10px;}

.slip-breakdown-card{border-top:2px solid #8C7B65;border-bottom:2px solid #8C7B65;background:#fff;margin-top:4px;}
.slip-table{width:100%;border-collapse:collapse;font-size:12px;}
.slip-table th{border-bottom:1px solid #D5DBE6;padding:7px 10px;font-size:11px;font-weight:700;color:#8C7B65;letter-spacing:0.04em;background:#FAFBFC;}
.slip-table td{border-bottom:1px solid #EBEFF5;padding:7px 10px;font-size:12px;color:#2D3748;}
.slip-table td.item-name{font-weight:500;}
.slip-table td.item-name.highlight{color:#16A085;font-weight:700;}
.slip-table td.num{text-align:center;color:#4A5568;}
.slip-table td.amt{text-align:right;font-family:Carlito,Calibri,sans-serif;}
.slip-table td.amt.highlight{color:#16A085;font-weight:700;}
.slip-table tr.summary-row td{border-top:1px solid #D5DBE6;border-bottom:1px solid #D5DBE6;font-weight:700;}
.slip-table tr.summary-row.gross td{background:#F9FBFC;}
.slip-table tr.summary-row.net td{background:#F3F6FA;color:#2C3E50;font-size:12.5px;border-bottom:2px solid #8C7B65;}
.slip-table tr.summary-row.net td.net-label{color:#2C3E50;font-weight:700;}
.slip-table tr.summary-row.net td.net-amt{color:#2C3E50;font-weight:700;}
</style></head><body>
<title>A&amp;H HR Letters</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#EEF1F6;--panel:#FFFFFF;--ink:#16233F;--muted:#5A6580;--line:#D5DBE6;--navy:#1F3A73;--gold:#C39A2F;--field:#F7F8FB;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1522;--panel:#182033;--ink:#E6EAF3;--muted:#9AA5BE;--line:#2C3750;--navy:#8FB0F0;--gold:#D9B24E;--field:#111827;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1522;--panel:#182033;--ink:#E6EAF3;--muted:#9AA5BE;--line:#2C3750;--navy:#8FB0F0;--gold:#D9B24E;--field:#111827;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Figtree,system-ui,sans-serif}
.wrap{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;padding:20px 16px;max-width:1400px;margin:0 auto}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;align-self:start;position:sticky;top:env(safe-area-inset-top,0px);max-height:calc(100vh - 40px);overflow:auto}
@media(max-width:860px){.panel{position:static;max-height:none}}
h1{font-size:18px;margin:0 0 2px;color:var(--navy)}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:999px;padding:6px 11px;font:500 12.5px Figtree,sans-serif;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--navy);color:var(--panel);border-color:var(--navy)}
fieldset{border:0;border-top:1px solid var(--line);padding:12px 0 4px;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
legend{font:600 11px Figtree,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);padding-right:8px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
label.full{grid-column:1/-1}
input,select,textarea{font:13px Figtree,sans-serif;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%;box-sizing:border-box}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.actions{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:-18px;background:var(--panel);padding:10px 0}
.btn{flex:1;border:0;border-radius:8px;padding:11px;font:600 14px Figtree,system-ui,sans-serif;cursor:pointer;background:var(--navy);color:var(--panel)}
.btn.alt{background:transparent;color:var(--navy);border:1px solid var(--line);flex:0 0 auto}
#msg{font-size:12.5px;color:var(--muted);min-height:18px}
.stage{overflow-x:auto;display:flex;flex-direction:column;align-items:center;gap:18px;padding-bottom:30px}
.page{width:816px;height:1056px;background:#fff;position:relative;box-shadow:0 2px 14px rgba(20,30,60,.18);flex:none;overflow:hidden;color:#111}
.page .hd{position:absolute;top:0;left:0;width:816px;height:209px}
.page .ft{position:absolute;bottom:0;left:0;width:816px;height:109px}
.body{position:absolute;top:190px;bottom:124px;left:70px;right:70px;font:14px/1.38 Carlito,Calibri,"Segoe UI",sans-serif;text-align:justify;overflow:hidden}
.body p{margin:0 0 11px}
.body .t{text-align:center;font-weight:700;font-size:18px;text-decoration:underline;margin:4px 0 16px}
.body .ax{text-align:center;font-weight:700;font-size:15px;margin:0 0 4px}
.body .h{font-weight:700;margin:14px 0 8px}
.body .li{display:grid;grid-template-columns:24px 1fr;margin:0 0 9px}
.body .li b.n{font-weight:700}
.body table{border-collapse:collapse;margin:4px auto 16px;font-size:13.5px}
.body td,.body th{border:1px solid #000;padding:3px 14px;text-align:center;min-width:140px}
.body th{background:#F8CBAD}.body td{background:#C6E0B4}.body tr:last-child td{font-weight:700}
.sig .nm{color:#1F3A73;font-weight:700;font-size:16px}.sig .rl{color:#B8732E}.sig .ct{color:#555;font-size:12px}
.adr p{margin:0}
</style>

</form>

 `<p>We are pleased to offer you the position of <b>${e(v.desig)}</b> with our organization${pt?" on a <b>part-time</b> basis":""}. Your employment will begin on <b>${e(v.join)}</b> and you will be working <b>${e(v.hours)}</b>. We believe that your skills and experience make you an excellent candidate for this position.</p>`,
 `<p>The date of your joining would be <b>${e(v.join)}</b>. You will initially be employed at the Company’s office address. ${pt?"Depending upon business requirements and with the approval of your reporting manager, your working hours may be split between office and remote work, provided the agreed weekly hours are completed and appropriately recorded.":"If required, you may also be assigned to work across different sites as per business needs."}</p>`,
 `<p>The terms and conditions of your Offer have been mentioned in the Annexure to this letter.<br>Your Total Gross Monthly Salary as applicable has been detailed in Annexure.</p>`,

 `<p>On successful completion of the probation, your employment with the company will stand confirmed subject to the terms and conditions as per Company policies.</p>`,

 `<p>We request you to please carry a signed copy of the offer letter on the day of your joining as a token of your acceptance. You should also bring your passport, visa, Emirates ID and police clearance certificate copies (and other documentation, if necessary). Copies will be taken of these documents for our records.</p>`,
 `<p>Welcome to A&amp;H. We wish you a long, rewarding and fulfilling career and look forward to your joining us.</p>`,B,
 `<div class="ax">ANNEXURE</div><div class="ax" style="margin-bottom:14px">The terms and conditions of your employment will be as follows:</div>`,
 `<p>In the capacity of <b>"${e(v.desig)}"</b>, you have been provided a <b>“${e(v.mode)}”</b>. You will report to <b>${e(v.report)}</b>, or any other person nominated by the company. ${e(v.duties)} Your services may be transferred to any other Department/Division / Location of the Company. You may also be assigned other duties, as may become necessary for the company, and at the discretion of the Management.</p>`,
 `<div class="h">I. Salary</div>`,
 `<p>Your monthly remuneration will be <b>AED ${amt(tot)} (${words(tot)} Dirhams Only)</b>, payable monthly through bank transfer in accordance with the Company’s payroll procedures and the UAE Wage Protection System (WPS), where applicable.<br>This remuneration has been finalized considering your qualifications, relevant experience, and the roles and responsibilities assigned to you by A&amp;H.<br>The contract of employment shall be <b>${e(v.contract)}</b> from the date of joining, subject to UAE Labour Law and MOHRE regulations, and may be renewed thereafter by mutual written agreement.</p>`,
 KEEP(`<p>You will be paid the following remuneration per month.</p>${html}`),
 ...list([`Your remuneration may be reviewed annually as per the company policy, from time to time. Your increment and promotion will be determined solely on the basis of your behavior and performance on the Job. External factors such as the performance and progress of the company may impact your salary revisions.`,`Please note that your salary and agreed terms and conditions remain confidential between yourself and A&amp;H Consultants; under no circumstances are you required to reveal your salary details to your colleagues or any client or any employee of any client.`]),
 `<div class="h">II. Probation Period</div>`,

 `<div class="h">IV. Termination</div>`,

 `<div class="h">V. Confidentiality</div>`,
 ...list([`You will be required to maintain complete secrecy and confidentiality with regards to the work, clients, systems, software, financial and business information of A&amp;H. You will not divulge or disclose any information known by you during the course of your employment with A&amp;H.`,`In case of any incidence of a breach of trust, your appointment may be terminated by A&amp;H with immediate effect in accordance with UAE Labour Law.`,`You will not disclose, divulge or use any A&amp;H information of value and significance such as customers data, suppliers data, business plans, corporate strategies, automation plans, software development strategies, software modules, program codes, software algorithms, databases, technical apps / tools / products developed, technical &amp; other documents, and trade secrets; even after discontinuation of services with A&amp;H.`,`All the contract terms and conditions will be governed by the UAE Labour Law (Federal Decree-Law No. 33 of 2021, as amended) and MOHRE regulations. Any Gratuity or End of Service benefits shall be paid in accordance with the applicable UAE Labour Laws${pt?", considering the part-time nature of employment and contracted hours":""}. In case of any inconsistency, the MOHRE-registered contract shall prevail.`]),
 ...(v.noncompete==="Yes"?[`<div class="h">VI. Non-Compete</div>`,...list([`During the tenure of your employment with A&amp;H, you will not engage yourself in any assignment or employment with company / companies which carry on business similar to that of A&amp;H, without prior written approval of the Management.`,`You will refrain from taking up any job assignment with any of our business competitors or those in similar business for a period of 2 years after termination of service with us. Employees should not solicit business in their personal capacity and should only solicit business for the company.`])]:[]),
 KEEP(`<p style="margin-top:18px">Please note that the appointment letter should be treated as strictly confidential.</p>`+sigBlock(v))];return out},

payslip(v){
 const e=esc, curr=v.currency||'INR';
 const bVal = Number(String(v.basic).replace(/,/g,""))||0;
 const hVal = Number(String(v.housing).replace(/,/g,""))||0;
 const oVal = Number(String(v.other_allow).replace(/,/g,""))||0;
 const tVal = Number(String(v.trans_allow).replace(/,/g,""))||0;

 const gross = bVal + hVal + oVal + tVal + iVal;

       <td class="lbl">Person in charge</td>

       <td class="lbl">Computed on</td>

     <tr>
       <td class="val">${e(v.email)}</td>

 const page2 = `
 <div class="slip-breakdown-card">

     <thead>
       <tr>
         <th style="width:38%;">NAME</th>
         <th style="width:20%; text-align:center;">NUMBER OF HOURS</th>

         <th style="width:22%; text-align:right;">AMOUNT</th>
       </tr>
     </thead>
     <tbody>
       <tr class="highlight-row">
         <td class="item-name highlight">Basic Salary</td>
         <td class="num">${e(v.basic_hrs)}</td>
         <td class="num">${e(v.basic_days)}</td>
         <td class="amt highlight">${fmtCur(bVal, curr)}</td>
       </tr>
       <tr>
         <td class="item-name">Housing Allowance</td>
         <td class="num">${e(v.housing_hrs)}</td>
         <td class="num">${e(v.housing_days)}</td>
         <td class="amt">${fmtCur(hVal, curr)}</td>
       </tr>
       <tr>
         <td class="item-name">Other Allowances</td>
         <td class="num">${e(v.other_hrs)}</td>
         <td class="num">${e(v.other_days)}</td>
         <td class="amt">${fmtCur(oVal, curr)}</td>
       </tr>
       <tr>
         <td class="item-name">Transportation Allowance</td>
         <td class="num">${e(v.trans_hrs)}</td>
         <td class="num">${e(v.trans_days)}</td>

       </tr>
       <tr>
         <td class="item-name">Internet Reimbursement</td>
         <td class="num">${e(v.internet_hrs)}</td>

       </tr>
       <tr class="summary-row net">

 </div>

 return [page1, B, page2];
},

exp(v){const e=esc,p=v.title==="Mr."?["his","He"]:["her","She"];return [`<div class="t">EXPERIENCE LETTER</div>`,`<p>Date: ${e(v.date)}</p><p>&nbsp;</p>`,`<p><b>TO WHOM IT MAY CONCERN</b></p>`,
 `<p>This is to certify that <b>${e(v.title)} ${e(v.name)}</b> was employed with <b>A&amp;H Consultants LLC</b> as <b>${e(v.desig)}</b> in the ${e(v.dept)} Department from <b>${e(v.from)}</b> to <b>${e(v.to)}</b>.</p>`,
 `<p>During ${p[0]} tenure, ${p[0]} key responsibilities included: ${e(v.duties)}</p>`,`<p>${e(v.remark)}</p>`,
 `<p>This certificate is issued upon the request of the employee without any liability on the part of A&amp;H Consultants LLC.</p>`,KEEP(sigBlock(v))]},
relieve(v){const e=esc;return [`<div class="t">RELIEVING LETTER</div>`,head(v),`<p><b>Dear ${e(v.title)} ${e(v.first)},</b></p>`,
 `<p>This is with reference to your resignation dated <b>${e(v.resign)}</b> from the position of <b>${e(v.desig)}</b>. We wish to inform you that your resignation has been accepted and you are relieved from your duties with <b>A&amp;H Consultants LLC</b> with effect from the close of business hours on <b>${e(v.to)}</b>.</p>`,
 `<p>Your tenure with the Company was from <b>${e(v.from)}</b> to <b>${e(v.to)}</b>. We confirm that you have completed the handover formalities, and your full and final settlement will be processed in accordance with Company policy and the applicable UAE Labour Law.</p>`,
 `<p>Please note that the confidentiality obligations agreed during your employment continue to apply after your separation from A&amp;H.</p>`,
 `<p>We thank you for your contributions and wish you success in your future endeavours.</p>`,KEEP(sigBlock(v))]},
salary(v){const e=esc,{tot,html}=salTable(v);return [`<div class="t">SALARY CERTIFICATE</div>`,`<p>Date: ${e(v.date)}</p><p>&nbsp;</p>`,`<p><b>TO WHOM IT MAY CONCERN</b></p>`,
 `<p>This is to certify that <b>${e(v.title)} ${e(v.name)}</b>, ${e(v.nat)} national, holding Passport No. <b>${e(v.pp)}</b>, is employed with <b>A&amp;H Consultants LLC</b> as <b>${e(v.desig)}</b> since <b>${e(v.from)}</b>.</p>`,
 KEEP(`<p>The employee’s current monthly remuneration is <b>AED ${amt(tot)} (${words(tot)} Dirhams Only)</b>, detailed as follows:</p>${html}`),
 `<p>This certificate is issued at the request of the employee for the purpose of ${e(v.purpose)}, without any financial liability on the part of A&amp;H Consultants LLC.</p>`,KEEP(sigBlock(v))]},
noc(v){const e=esc;return [`<div class="t">NO OBJECTION CERTIFICATE</div>`,`<p>Date: ${e(v.date)}</p><p>&nbsp;</p>`,`<p><b>TO WHOM IT MAY CONCERN</b></p>`,
 `<p>This is to certify that <b>${e(v.title)} ${e(v.name)}</b>, ${e(v.nat)} national, holding Passport No. <b>${e(v.pp)}</b>, is employed with <b>A&amp;H Consultants LLC</b> as <b>${e(v.desig)}</b> since <b>${e(v.from)}</b>.</p>`,
 `<p>The Company has no objection to ${e(v.first)}’s ${e(v.purpose)}.</p>`,
 `<p>This certificate is issued at the request of the employee without any liability on the part of A&amp;H Consultants LLC.</p>`,KEEP(sigBlock(v))]}
};
function newPage(stage){const p=document.createElement('div');p.className="page";p.innerHTML=`<img class="hd" src="${HD}" alt=""><img class="ft" src="${FT}" alt=""><div class="body"></div>`;stage.appendChild(p);return p.querySelector('.body')}
function render(){const stage=document.getElementById('stage');stage.innerHTML="";const blocks=BUILD[cur](vals[cur]);let body=newPage(stage);
 for(const b of blocks){if(b===B){if(body.childElementCount)body=newPage(stage);continue}
  const h=typeof b==="string"?b:b.keep,w=document.createElement('div');w.innerHTML=h;body.appendChild(w);
  if(body.scrollHeight>body.clientHeight+1&&body.childElementCount>1){w.remove();body=newPage(stage);body.appendChild(w)}}
 fit()}
function fit(){const st=document.getElementById('stage'),z=Math.min(1,(st.clientWidth-4)/816);st.querySelectorAll('.page').forEach(p=>p.style.zoom=z)}
addEventListener('resize',fit);
document.getElementById('reset').onclick=()=>{delete vals[cur];buildFields();render()};
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();const msg=document.getElementById('msg'),btn=document.getElementById('dl');
 btn.disabled=true;msg.textContent="Building PDF…";const pages=[...document.querySelectorAll('.page')];pages.forEach(p=>p.style.zoom=1);
 try{await document.fonts.ready;const pdf=new jspdf.jsPDF({unit:"pt",format:"letter"});
  for(let i=0;i<pages.length;i++){const c=await html2canvas(pages[i],{scale:2,backgroundColor:"#fff",useCORS:true});if(i)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",0,0,612,792)}
  const v=vals[cur],fn=`AH_${(v.emp_name||v.name||"Doc").trim().replace(/\s+/g,"_")}_${DOCS[cur].label.replace(/\s+/g,"_")}.pdf`;
  const blob = pdf.output("blob");
  const d=await window.claude?.use?.("downloads");
  if(d){
    await d.save({filename:fn,data:blob});
    msg.textContent="Saved "+fn;
  } else {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fn;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
    msg.textContent="Downloaded "+fn;
  }
 }
 catch(e){msg.textContent=e&&e.code==="declined"?"Download cancelled.":"Couldn't create the PDF: "+(e.message||e.code||e)}
 finally{btn.disabled=false;fit()}});
buildTabs();buildFields();document.fonts.ready.then(render);render();
</script>
